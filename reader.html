<style>
:root {
  --bg: #eef0f4; --bar: #ffffff; --text: #1b1f2a; --muted: #6b7280; --accent: #0d6efd;
  --page-shadow: 0 4px 18px rgba(0,0,0,.18); --line: rgba(0,0,0,.12);
}
body.dark {
  --bg: #0f1218; --bar: #151821; --text: #e8eaf0; --muted: #9aa3b2; --accent: #6ea8fe;
  --page-shadow: 0 4px 18px rgba(0,0,0,.6); --line: rgba(255,255,255,.14);
}
* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", Arial, sans-serif;
  padding-top: calc(var(--bar-h, 96px) + env(safe-area-inset-top, 0px));
}

/* ---------- top bar ---------- */
.rd-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: var(--bar);
  border-bottom: 1px solid var(--line); box-shadow: 0 2px 10px rgba(0,0,0,.12);
  padding-top: env(safe-area-inset-top, 0px);
}
.rd-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
.rd-back, .rd-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: transparent; color: var(--text); font-size: .85rem;
  text-decoration: none; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.rd-back:hover, .rd-btn:hover { background: rgba(127,127,127,.15); }
.rd-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.rd-title { flex: 1; min-width: 0; text-align: center; font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rd-title small { font-weight: 400; color: var(--muted); margin-inline-start: 8px; }
.rd-tools { display: flex; gap: 6px; }
.rd-progress { height: 5px; background: var(--line); }
.rd-fill { height: 100%; width: 0; background: linear-gradient(90deg, #198754, var(--accent)); transition: width .15s linear; }
.rd-meta { display: flex; justify-content: space-between; padding: 4px 14px 6px; font-size: .78rem; color: var(--muted); }

/* ---------- pages ---------- */
#rd-pages { width: var(--w, 860px); margin: 18px auto 0; position: relative; }
.rd-page {
  position: relative; width: 100%; background: #fff; margin: 0 auto 16px; box-shadow: var(--page-shadow);
  border-radius: 3px; overflow: hidden;
}
.rd-page::after { content: attr(data-n); position: absolute; inset: 0; display: grid; place-items: center; color: #c3c8d2; font-size: 1.4rem; pointer-events: none; }
.rd-page.done::after { display: none; }
.rd-page canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
body.dark .rd-page canvas { filter: invert(.9) hue-rotate(180deg); }
body.dark .rd-page { background: #1b1f2a; }
body.dark .rd-page::after { color: #3b4252; }

/* ---------- status / dialogs ---------- */
#rd-status { width: min(560px, 92vw); margin: 60px auto; text-align: center; color: var(--muted); }
.rd-spin { width: 38px; height: 38px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: rdspin .9s linear infinite; }
@keyframes rdspin { to { transform: rotate(360deg); } }
#rd-status a { color: var(--accent); }

#rd-resume {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60;
  width: min(560px, 94vw); background: var(--bar); color: var(--text); border: 1px solid var(--line);
  border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 14px 16px; display: none;
}
#rd-resume p { margin: 0 0 10px; font-size: .95rem; }
#rd-resume .rd-actions { display: flex; gap: 8px; flex-wrap: wrap; }

#rd-end { width: var(--w, 860px); margin: 26px auto 70px; text-align: center; padding: 28px 18px; background: var(--bar); border: 1px solid var(--line); border-radius: 16px; display: none; }
#rd-end h2 { margin: 0 0 14px; font-size: 1.15rem; }
#rd-end .rd-actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.rd-more { display: flex; gap: 14px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.rd-more a { width: 120px; text-decoration: none; color: var(--text); font-size: .8rem; }
.rd-more img { width: 100%; border-radius: 6px; box-shadow: var(--page-shadow); display: block; margin-bottom: 6px; }

#rd-top { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: none; }
[dir="rtl"] #rd-top { right: auto; left: 16px; }
[dir="rtl"] .rd-arrow { display: inline-block; transform: scaleX(-1); }

@media (max-width: 640px) {
  .rd-row { padding: 6px 8px; gap: 6px; }
  .rd-title small { display: none; }
  .rd-back, .rd-btn { padding: 7px 10px; }
  .rd-label { display: none; }
}
@media print { .rd-bar, #rd-resume, #rd-top { display: none; } }
</style>
</head>

  function measure() {
    var sy = window.scrollY;
    for (var i = 0; i < els.length; i++) { var r = els[i].getBoundingClientRect(); tops[i] = r.top + sy; heights[i] = r.height; }
  }

  /* ===================== progress ===================== */
  function currentPos() {
    var y = window.scrollY + barHeight() + 10, lo = 0, hi = N - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (tops[mid] <= y) lo = mid; else hi = mid - 1; }
    var f = Math.max(0, Math.min(1, (y - tops[lo]) / (heights[lo] || 1)));
    var pct = Math.round(100 * (lo + f) / N);
    var atEnd = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 6;
    if (atEnd) { pct = 100; lo = N - 1; f = 1; }
    return { p: lo, f: f, pct: Math.max(0, Math.min(100, pct)) };
  }
  function update() {
    ticking = false;
    if (!N) return;
    cur = currentPos();
    $('rd-fill').style.width = cur.pct + '%';
    $('rd-progressbar').setAttribute('aria-valuenow', cur.pct);
    $('rd-page-label').textContent = fmt(L.page, { n: cur.p + 1, t: N });
    $('rd-pct-label').textContent = fmt(L.read, { p: cur.pct });
    $('rd-top').style.display = window.scrollY > 900 ? 'inline-flex' : 'none';
    trim(); save(false);
    if (userScrolled) {
      [25, 50, 75].forEach(function (m) {
        if (cur.pct >= m && !fired[m]) { fired[m] = true; track('Book Reader Progress: ' + TITLE + ' ' + m + '%'); }
      });
      if (cur.pct >= 99 && !finishedFired) {
        finishedFired = true; fired[25] = fired[50] = fired[75] = true;
        track('Book Reader Finished: ' + TITLE);
      }
    }
  }
  var scrollTimer = null;
  window.addEventListener('scroll', function () {
    if (Math.abs(window.scrollY - (window.__rdStartY || 0)) > 20) { userScrolled = true; saveEnabled = true; }
    if (!ticking) { ticking = true; requestAnimationFrame(update); }
    clearTimeout(scrollTimer); scrollTimer = setTimeout(function () { save(true); }, 400);
  }, { passive: true });
  window.addEventListener('pagehide', function () { save(true); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(true); });

  function scrollToPos(p, f, smooth) {
    var y = tops[p] + f * heights[p] - barHeight() - 10;
    window.scrollTo({ top: Math.max(0, y), behavior: smooth ? 'smooth' : 'auto' });
  }

  /* ===================== buttons ===================== */
  function relayout(keepPos) {
    var pos = keepPos ? currentPos() : null;
    applyWidth(); syncBar();
    requestAnimationFrame(function () {
      measure();
      if (pos) scrollToPos(pos.p, pos.f, false);
      resetRender(); update();
    });
  }
  $('rd-larger').onclick = function () { if (zi < ZOOMS.length - 1) { zi++; ls('reader:zoom', zi); relayout(true); } };
  $('rd-smaller').onclick = function () { if (zi > 0) { zi--; ls('reader:zoom', zi); relayout(true); } };
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { relayout(true); }, 200); });
  $('rd-top').onclick = function () { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  $('rd-download').addEventListener('click', function () { track('Book Reader Download: ' + TITLE); });
  $('rd-end-download').addEventListener('click', function () { track('Book Reader Download: ' + TITLE); });
  $('rd-back').addEventListener('click', function () { track('Book Reader Back To Site: ' + TITLE); });
  $('rd-end-back').addEventListener('click', function () { track('Book Reader Back To Site: ' + TITLE); });

  /* ===================== load the book ===================== */
  function showError() {
    var st = $('rd-status');
    st.innerHTML = '<div style="font-size:2rem">📖</div><p></p><p><a></a></p>';
    st.querySelector('p').textContent = L.error;
    var a = st.querySelector('a'); a.href = book.file; a.setAttribute('download', slug + '.pdf'); a.textContent = L.download;
  }

  if (typeof pdfjsLib === 'undefined') { showError(); return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  pdfjsLib.getDocument({ url: book.file }).promise.then(function (pdf) {
    doc = pdf; N = pdf.numPages;
    return pdf.getPage(1);
  }).then(function (p1) {
    var vp = p1.getViewport({ scale: 1 }); ratio = vp.height / vp.width;
    $('rd-status').style.display = 'none';

    var frag = document.createDocumentFragment();
    for (var i = 1; i <= N; i++) {
      var d = document.createElement('div');
      d.className = 'rd-page'; d.dataset.n = i; d.style.aspectRatio = vp.width + ' / ' + vp.height;
      frag.appendChild(d); els.push(d);
    }
    pagesEl.appendChild(frag);
    $('rd-end').style.display = 'block';
    buildEnd();

    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var n = +e.target.dataset.n;
        if (e.isIntersecting) { visible.add(n); renderPage(n); } else visible.delete(n);
      });
    }, { rootMargin: '1400px 0px' });
    els.forEach(function (e) { io.observe(e); });

    requestAnimationFrame(function () {
      syncBar(); measure(); window.__rdStartY = window.scrollY; update();
      var s = readSaved();
      var hasProgress = s && s.N === N && (s.p > 1 || s.f > 0.03) && s.pct < 99;
      track('Book Reader Open: ' + TITLE);
      if (hasProgress) {
        $('rd-resume-text').textContent = fmt(L.welcome, { n: s.p, p: s.pct });
        $('rd-resume').style.display = 'block';
        $('rd-continue').onclick = function () {
          $('rd-resume').style.display = 'none';
          [25, 50, 75].forEach(function (m) { if (s.pct >= m) fired[m] = true; });   // milestones already counted before
          saveEnabled = true;
          scrollToPos(s.p - 1, s.f, true);
          track('Book Reader Resume: ' + TITLE);
        };
        $('rd-startover').onclick = function () {
          $('rd-resume').style.display = 'none';
          ls(KEY, null); saveEnabled = true;
          track('Book Reader Start Over: ' + TITLE);
        };
      } else if (s && s.pct >= 99) {
        ls(KEY, null);                                  // finished before: start fresh, nothing to resume
      }
    });
  }).catch(function () { showError(); });

  function buildEnd() {
    var box = $('rd-more'); box.innerHTML = '';
    Object.keys(BOOKS).forEach(function (k) {
      if (k === slug) return;
      var a = document.createElement('a'); a.href = 'reader.html?book=' + k;
      a.innerHTML = '<img alt=""><span></span>';
      a.querySelector('img').src = 'img/books/' + k + '.jpg';
      a.querySelector('span').textContent = BOOKS[k].en;
      box.appendChild(a);
    });
  }
})();
</script>
</body>
</html>
