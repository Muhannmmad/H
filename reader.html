<style>
/* Every rule that older browsers might not understand has a plain fallback written before it. */
:root {
  --bg: #eef0f4; --bar: #ffffff; --text: #1b1f2a; --muted: #6b7280; --accent: #0d6efd;
  --page-shadow: 0 4px 18px rgba(0,0,0,.18); --line: rgba(0,0,0,.12);
}
body.dark {
  --bg: #0f1218; --bar: #151821; --text: #e8eaf0; --muted: #9aa3b2; --accent: #6ea8fe;
  --page-shadow: 0 4px 18px rgba(0,0,0,.6); --line: rgba(255,255,255,.14);
}
* { -webkit-box-sizing: border-box; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; padding-top: 96px;                       /* reader-app.js sets the exact value */
  background: #eef0f4; background: var(--bg);
  color: #1b1f2a; color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", Arial, sans-serif;
}
body.dark { background: #0f1218; color: #e8eaf0; }

/* ---------- top bar ---------- */
.rd-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: #fff; background: var(--bar);
  border-bottom: 1px solid rgba(0,0,0,.12); border-bottom-color: var(--line);
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
  padding-top: constant(safe-area-inset-top); padding-top: env(safe-area-inset-top, 0px);
}
body.dark .rd-bar { background: #151821; }
.rd-row { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center; padding: 8px 14px; }
.rd-row > * + * { margin-left: 10px; }
[dir="rtl"] .rd-row > * + * { margin-left: 0; margin-right: 10px; }
.rd-back, .rd-btn {
  display: -webkit-inline-box; display: -ms-inline-flexbox; display: inline-flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center;
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid rgba(0,0,0,.12); border-color: var(--line); background: transparent;
  color: inherit; font-size: .85rem; text-decoration: none; cursor: pointer; white-space: nowrap; font-family: inherit;
}
.rd-back > * + *, .rd-btn > * + * { margin-left: 6px; }
[dir="rtl"] .rd-back > * + *, [dir="rtl"] .rd-btn > * + * { margin-left: 0; margin-right: 6px; }
.rd-back:hover, .rd-btn:hover { background: rgba(127,127,127,.15); }
.rd-btn.primary { background: #0d6efd; background: var(--accent); border-color: #0d6efd; border-color: var(--accent); color: #fff; }
.rd-title { -webkit-box-flex: 1; -ms-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; text-align: center; font-weight: 700; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rd-title small { font-weight: 400; color: #6b7280; color: var(--muted); margin-left: 8px; }
[dir="rtl"] .rd-title small { margin-left: 0; margin-right: 8px; }
.rd-tools { display: -webkit-box; display: -ms-flexbox; display: flex; }
.rd-tools > * + * { margin-left: 6px; }
[dir="rtl"] .rd-tools > * + * { margin-left: 0; margin-right: 6px; }
.rd-progress { height: 5px; background: rgba(0,0,0,.12); background: var(--line); }
.rd-fill { height: 100%; width: 0; background: #198754; background: -webkit-linear-gradient(left, #198754, #0d6efd); background: linear-gradient(90deg, #198754, var(--accent)); -webkit-transition: width .15s linear; transition: width .15s linear; }
.rd-meta { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-pack: justify; -ms-flex-pack: justify; justify-content: space-between; padding: 4px 14px 6px; font-size: .78rem; color: #6b7280; color: var(--muted); }

/* ---------- pages (reader-app.js gives every page box its exact width and height) ---------- */
#rd-pages { width: 860px; max-width: none; margin: 18px auto 0; position: relative; }
.rd-page {
  position: relative; width: 100%; background: #fff; margin: 0 auto 16px;
  -webkit-box-shadow: 0 4px 18px rgba(0,0,0,.18); box-shadow: var(--page-shadow);
  border-radius: 3px; overflow: hidden;
}
.rd-page::after {
  content: attr(data-n); position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-align: center; -ms-flex-align: center; align-items: center; -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
  color: #c3c8d2; font-size: 1.4rem; pointer-events: none;
}
.rd-page.done::after { display: none; }
.rd-page.failed::after { content: "\26A0  " attr(data-n); color: #b45309; }
.rd-page canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
body.dark .rd-page canvas { -webkit-filter: invert(.9) hue-rotate(180deg); filter: invert(.9) hue-rotate(180deg); }
body.dark .rd-page { background: #1b1f2a; }
body.dark .rd-page::after { color: #3b4252; }

/* ---------- loading / fallback screen ---------- */
#rd-status { width: 560px; max-width: 92%; margin: 60px auto; text-align: center; color: #6b7280; color: var(--muted); }
#rd-status.rd-fallback { width: 1100px; max-width: 96%; margin: 14px auto; }
.rd-spin { width: 38px; height: 38px; border: 4px solid rgba(0,0,0,.12); border-color: var(--line); border-top-color: #0d6efd; border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; -webkit-animation: rdspin .9s linear infinite; animation: rdspin .9s linear infinite; }
@-webkit-keyframes rdspin { to { -webkit-transform: rotate(360deg); } }
@keyframes rdspin { to { transform: rotate(360deg); } }
.rd-fb-msg { color: #1b1f2a; color: var(--text); font-size: 1rem; margin: 18px 0 14px; }
.rd-fb-actions { margin: 0 0 16px; }
.rd-fb-actions .rd-btn { margin: 4px 5px; padding: 10px 18px; font-size: .95rem; }
.rd-fb-actions .rd-btn:not(.primary) { color: #1b1f2a; color: var(--text); }
.rd-native { width: 100%; height: 70vh; min-height: 420px; border: 1px solid rgba(0,0,0,.12); border-color: var(--line); border-radius: 8px; background: #fff; }
.rd-tech { margin-top: 10px; font-size: .75rem; text-align: left; }
[dir="rtl"] .rd-tech { text-align: right; }
.rd-dbg { white-space: pre-wrap; word-wrap: break-word; word-break: break-word; }

#rd-resume {
  position: fixed; left: 50%; bottom: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60;
  -webkit-transform: translateX(-50%); transform: translateX(-50%);
  width: 560px; max-width: 94%; background: #fff; background: var(--bar); color: inherit; border: 1px solid rgba(0,0,0,.12); border-color: var(--line);
  border-radius: 16px; -webkit-box-shadow: 0 10px 30px rgba(0,0,0,.35); box-shadow: 0 10px 30px rgba(0,0,0,.35); padding: 14px 16px; display: none;
}
body.dark #rd-resume { background: #151821; }
#rd-resume p { margin: 0 0 10px; font-size: .95rem; }
.rd-actions { display: -webkit-box; display: -ms-flexbox; display: flex; -ms-flex-wrap: wrap; flex-wrap: wrap; }
.rd-actions > * { margin: 0 8px 8px 0; }
[dir="rtl"] .rd-actions > * { margin: 0 0 8px 8px; }

#rd-end { width: 860px; max-width: none; margin: 26px auto 70px; text-align: center; padding: 28px 18px; background: #fff; background: var(--bar); border: 1px solid rgba(0,0,0,.12); border-color: var(--line); border-radius: 16px; display: none; }
body.dark #rd-end { background: #151821; }
#rd-end h2 { margin: 0 0 14px; font-size: 1.15rem; }
#rd-end .rd-actions { -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center; }
#rd-end .rd-actions > * { margin: 0 4px 8px; }
.rd-more { display: -webkit-box; display: -ms-flexbox; display: flex; -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center; -ms-flex-wrap: wrap; flex-wrap: wrap; margin-top: 22px; }
.rd-more a { width: 120px; margin: 0 7px 14px; text-decoration: none; color: inherit; font-size: .8rem; }
.rd-more img { width: 100%; border-radius: 6px; -webkit-box-shadow: 0 4px 18px rgba(0,0,0,.18); box-shadow: var(--page-shadow); display: block; margin-bottom: 6px; }

#rd-top { position: fixed; right: 16px; bottom: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: none; }
[dir="rtl"] #rd-top { right: auto; left: 16px; }
[dir="rtl"] .rd-arrow { display: inline-block; -webkit-transform: scaleX(-1); transform: scaleX(-1); }

.rd-noscript { padding: 120px 20px 40px; text-align: center; }

@media (max-width: 640px) {
  .rd-row { padding: 6px 8px; }
  .rd-row > * + * { margin-left: 6px; }
  [dir="rtl"] .rd-row > * + * { margin-left: 0; margin-right: 6px; }
  .rd-title small { display: none; }
  .rd-back, .rd-btn { padding: 7px 10px; }
  .rd-label { display: none; }
  .rd-fb-actions .rd-label { display: inline; }
}
@media print { .rd-bar, #rd-resume, #rd-top { display: none; } }
</style>
</head>
